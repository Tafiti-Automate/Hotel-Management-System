name: HOD draft save validation

on:
  push:
    branches:
      - chatgpt-fix-hod-draft-save-500

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hotel_erp_backend/requirements.txt
      - run: pip install -r hotel_erp_backend/requirements.txt
      - run: pytest -q hotel_erp_backend/tests/test_hod_draft_save_regression.py
