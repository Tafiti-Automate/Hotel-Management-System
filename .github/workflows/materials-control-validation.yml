name: Materials control validation

on:
  push:
    branches:
      - 'back$front'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hotel_erp_backend/requirements/dev.txt
      - run: python -m pip install -r hotel_erp_backend/requirements/dev.txt
      - name: Django model and migration checks
        run: |
          python hotel_erp_backend/manage.py check --settings=core.settings.test
          python hotel_erp_backend/manage.py makemigrations --check --dry-run --settings=core.settings.test
      - name: Full Django regression suite
        run: python -m pytest hotel_erp_backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    env:
      BACKEND_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
