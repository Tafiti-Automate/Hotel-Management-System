name: Report production validation

on:
  push:
    branches:
      - chatgpt-reports-production-polish

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hotel_erp_backend/requirements.txt
      - run: pip install -r hotel_erp_backend/requirements.txt
      - run: python hotel_erp_backend/manage.py check --settings=core.settings.test
      - run: pytest -q hotel_erp_backend/tests/test_reports.py hotel_erp_backend/tests/test_report_role_access.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
