name: ChatGPT regression validation

on:
  push:
    branches:
      - chatgpt-fix-supervisor-hod-regression

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Compile changed backend modules
        run: python -m py_compile hotel_erp_backend/apps/inventory/urls.py hotel_erp_backend/apps/inventory/transaction_controls.py
