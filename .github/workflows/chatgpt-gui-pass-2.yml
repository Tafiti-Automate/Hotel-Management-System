name: ChatGPT GUI pass 2

on:
  push:
    branches:
      - chatgpt-gui-pass-2

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-gui-pass-2
          fetch-depth: 0

      - name: Apply GUI polish
        run: python .github/scripts/gui_pass_2.py

      - name: Commit GUI changes
        run: |
          git config user.name "Watumwa"
          git config user.email "127853693+watumwa@users.noreply.github.com"
          git add frontend/src/components/Header.tsx frontend/src/screens/DepartmentRequisitions.tsx frontend/src/department-requisitions-polish.css frontend/src/responsive.css
          if ! git diff --cached --quiet; then
            git commit -m "refactor(ux): simplify mobile requisition entry and header time"
            git push origin HEAD:chatgpt-gui-pass-2
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
