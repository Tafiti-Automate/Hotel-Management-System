name: ChatGPT validation

on:
  push:
    branches:
      - chatgpt-ux-hardening-2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hotel_erp_backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r hotel_erp_backend/requirements.txt

      - name: Django system check
        run: python hotel_erp_backend/manage.py check --settings=core.settings.test

      - name: Department requisition regression tests
        run: pytest -q hotel_erp_backend/tests/test_department_head_requisitions.py hotel_erp_backend/tests/test_auth.py -k "not role_permission_changes_are_returned_on_next_login"

      - name: Full backend regression scan
        continue-on-error: true
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
